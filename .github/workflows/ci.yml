name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs run in parallel so a PR waits only for the slowest one.
# Windows is slower to set up, so it runs after merging to main or on demand (Run workflow).
jobs:
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:unit

  minimum-editor:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRETTIFY_TEST_VSCODE_VERSION: '1.100.0'
      PRETTIFY_TEST_VUE_EXTENSION_VERSION: '3.1.1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Minimum-editor integration
        run: xvfb-run -a pnpm test

  package:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRETTIFY_TEST_VSCODE_VERSION: '1.100.0'
      PRETTIFY_TEST_VUE_EXTENSION_VERSION: '3.1.1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installed VSIX integration
        run: xvfb-run -a pnpm test:package
      - uses: actions/upload-artifact@v6
        with:
          name: prettify-ts-vsix
          path: packages/vscode-extension/*.vsix

  current-editor:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRETTIFY_TEST_VSCODE_VERSION: stable
      PRETTIFY_TEST_VUE_EXTENSION_VERSION: latest
      PRETTIFY_TEST_USE_WORKSPACE_TYPESCRIPT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Latest editor and Vue with workspace TypeScript
        run: xvfb-run -a pnpm test

  typescript-7-editor:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # VS Code serves TypeScript through the TypeScript 7 extension (built at the commit pinned in
      # test/typescript-7.json) with the pinned TypeScript 7 nightly, and TS Server off.
      PRETTIFY_TEST_TSGO: '1'
      PRETTIFY_TEST_VSCODE_VERSION: stable
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript 7 editor integration
        run: xvfb-run -a pnpm test

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PRETTIFY_TEST_VSCODE_VERSION: '1.100.0'
      PRETTIFY_TEST_VUE_EXTENSION_VERSION: '3.1.1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - name: Minimum-editor integration
        run: pnpm test
